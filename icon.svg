<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8cff"/>
      <stop offset="1" stop-color="#6a3fd6"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9eefc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#1b1060" flood-opacity=".28"/>
    </filter>
  </defs>

  <!-- macOS 圖示格線：824×824 的圓角方塊置中 -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>

  <!-- 後面那張：來源文件 -->
  <g transform="rotate(-8 400 470)" opacity=".55">
    <path d="M268 250 h210 l92 92 v300 a24 24 0 0 1 -24 24 h-278 a24 24 0 0 1 -24 -24 v-368 a24 24 0 0 1 24 -24 z" fill="#ffffff"/>
  </g>

  <!-- 前面那張：轉好的文件 -->
  <g filter="url(#shadow)">
    <path d="M430 300 h230 l104 104 v336 a26 26 0 0 1 -26 26 h-308 a26 26 0 0 1 -26 -26 v-414 a26 26 0 0 1 26 -26 z" fill="url(#page)"/>
    <path d="M660 300 v78 a26 26 0 0 0 26 26 h78 z" fill="#c9d4f5"/>
    <rect x="470" y="470" width="220" height="26" rx="13" fill="#b8c6f2"/>
    <rect x="470" y="530" width="180" height="26" rx="13" fill="#b8c6f2"/>
    <rect x="470" y="590" width="200" height="26" rx="13" fill="#b8c6f2"/>
  </g>

  <!-- 轉換箭頭 -->
  <g filter="url(#shadow)">
    <circle cx="352" cy="700" r="112" fill="#ffffff"/>
    <path d="M296 700 h96 m-40 -44 l44 44 l-44 44" fill="none" stroke="#5b4ee0" stroke-width="30"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
